# SPDX-License-Identifier: MIT
#
# Сборка и проверки Fwd81.
#
# Чего здесь нет и не будет: настоящей проверки на Windows 8.1. Раннеры GitHub —
# это Windows Server, восьмёрки среди них нет. Поэтому CI отвечает только на вопрос
# «собирается ли и соблюдены ли правила», а живая проверка делается руками
# по docs/testing.md.

name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: x64, Debug и Release
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить pefile
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile

      # Проверки запускаются отдельными шагами, а не внутри build.ps1: так в
      # журнале CI сразу видно, какая именно проверка упала.
      - name: Собрать
        shell: pwsh
        run: .\build.ps1 -Config Both -NoChecks

      - name: Проверить лицензионную границу
        shell: pwsh
        run: python tools/check_licenses.py

      - name: Ядро зависит только от ntdll (Debug)
        shell: pwsh
        run: python tools/check_image.py build/bin/Debug/fwd81core.dll --imports ntdll.dll

      - name: Ядро зависит только от ntdll (Release)
        shell: pwsh
        run: python tools/check_image.py build/bin/Release/fwd81core.dll --imports ntdll.dll

      - name: Утилиты запустятся на Windows 8.1 (Debug)
        shell: pwsh
        run: |
          python tools/check_image.py build/bin/Debug/fwd81cli.exe
          python tools/check_image.py build/bin/Debug/fwd81diag.exe

      - name: Утилиты запустятся на Windows 8.1 (Release)
        shell: pwsh
        run: |
          python tools/check_image.py build/bin/Release/fwd81cli.exe
          python tools/check_image.py build/bin/Release/fwd81diag.exe

      - name: Утилита отвечает на команду version
        shell: pwsh
        run: |
          .\build\bin\Release\fwd81cli.exe version
          if ($LASTEXITCODE -ne 0) { throw "fwd81cli version вернул $LASTEXITCODE" }

      - name: docs/coverage.md соответствует пометкам в src/libs
        shell: pwsh
        run: python tools/exportdiff/exportdiff.py check

      - name: exportdiff читает System32 раннера без ошибок (smoke-тест)
        shell: pwsh
        run: |
          python tools/exportdiff/exportdiff.py export
          if ($LASTEXITCODE -ne 0) { throw "exportdiff export вернул $LASTEXITCODE" }

      - name: fwd81diag разбирает настоящий EXE и не падает
        shell: pwsh
        run: |
          .\build\bin\Release\fwd81diag.exe C:\Windows\System32\notepad.exe
          # Код 5 (вердикт невозможен без базы 8.1) — это нормально для раннера.
          if ($LASTEXITCODE -notin 0,3,4,5) { throw "fwd81diag дал неожиданный код $LASTEXITCODE" }

      - name: Сохранить собранное
        uses: actions/upload-artifact@v4
        with:
          name: fwd81-x64
          path: build/bin/
          retention-days: 14
